[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-workflow"
version = "0.1.0"
description = "Seismic processing workflow for phase picking, association, absolute location, and HypoDD input generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "obspy",
    "pandas",
    "pygmt",
    "pyproj",
    "PyYAML",
    "seaborn",
    "seisbench",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
gui = [
    "nicegui",
    "watchdog",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
seismic-workflow = "seimlai.main:main"
seimlai-web = "seimlai.web.app:main"

[tool.setuptools.packages.find]
include = ["seimlai*"]

[tool.setuptools.package-data]
seimlai = ["logo/clilogo.txt", "gui/static/*.css", "gui/static/*.svg", "gui/static/*.js", "gui/static/fonts/*.ttf", "gui/static/fonts/*.txt"]
