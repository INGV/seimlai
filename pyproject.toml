[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-workflow"
version = "0.1.0"
description = "Seismic processing workflow for phase picking, association, absolute location, and HypoDD input generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "obspy",
    "pandas",
    "pygmt",
    "pyproj",
    "PyYAML",
    "seaborn",
    "seisbench",
    "torch",
    "tqdm",
]

[project.scripts]
seismic-workflow = "seimlai.main:main"

[tool.setuptools.packages.find]
include = ["seimlai*"]
